name: refresh

# THE COUNT and the rolled-up detail behind it. No model call, so this is free
# and can run often. The NPS key stays in Actions secrets and never reaches the
# published page.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Collect state
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python scripts/refresh.py
      - name: Commit
        run: |
          git config user.name  "the-register-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/state.json; then
            echo "no change"; exit 0
          fi
          git add data/state.json
          git commit -m "data: refresh state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
